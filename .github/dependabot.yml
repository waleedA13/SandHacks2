version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      # One PR for all action bumps, so they don't conflict in security.yml.
      github-actions:
        patterns: ["*"]

  # Uncomment the entry for our stack once its manifest (package.json / requirements.txt) exists.
